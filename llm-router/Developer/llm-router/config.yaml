# LiteLLM doesn't support oMLX yet, but it works like OpenAI server
# https://docs.litellm.ai/docs/proxy/config_settings

model_list:
  # My local AI model (oMLX)
  - model_name: hybrid-coder
    litellm_params:
      model: openai/gemma-4-12b-coder-fable5-composer2.5-4bit # copy the exact name from oMLX
      api_base: http://localhost:8001/v1
      api_key: "abcd"
      max_tokens: 8192
      timeout: 12
      rpm: 15        # max. requests per minute
      tpm: 25000     # max. tokens per minute
      model_info:
        max_input_tokens: 8192
        max_output_tokens: 4096

  # Cloud LLM as backup
  - model_name: mistral-backup
    litellm_params:
      model: mistral/mistral-medium-latest
      api_key: "os.environ/MISTRAL_API_KEY" # take the key from the env var
      max_tokens: 32768
      rpm: 1000
      tpm: 500000
      model_info:
        max_input_tokens: 32768

router_settings:
  fallbacks:
    - hybrid-coder: ["mistral-backup"]
  context_window_fallback: true
