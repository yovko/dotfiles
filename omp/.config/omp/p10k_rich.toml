console_title_template = '{{.UserName}}@{{.HostName}} in {{.PWD}}'
version = 4
final_space = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'
  newline = true

  [[blocks.segments]]
    template = ' {{ if .WSL }}WSL at {{ end }}{{.Icon}} '
    leading_diamond = '╭─'
    foreground = '#000000'
    background = '#d3d7cf'
    type = 'os'
    style = 'diamond'

  [[blocks.segments]]
    template = '{{ if ne .OS "darwin" }} {{ .UserName }} {{ end }}'
    foreground = '#f2f3f8'
    powerline_symbol = ''
    background = '#d75f00'
    type = 'session'
    style = 'powerline'

  [[blocks.segments]]
    template = '  {{ .Path }} '
    foreground = '#e4e4e4'
    powerline_symbol = ''
    background = '#3465a4'
    type = 'path'
    style = 'powerline'

    [blocks.segments.options]
      home_icon = '~'
#      style = 'full'
      style = 'agnoster_short'
      max_depth = 2
      

#    [blocks.segments.options.mapped_locations]
#      "~/Developer" = "󰲋"
#      "~/Documents" = "󰈙"
#      "~/Downloads" = ""
#      "~/Music" = "󰝚"
#      "~/Pictures" = ""

  [[blocks.segments]]
    template = ' {{ .HEAD }}{{if .BranchStatus }} {{ .BranchStatus }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if and (.Working.Changed) (.Staging.Changed) }} |{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}{{ if gt .StashCount 0 }}  {{ .StashCount }}{{ end }} '
    foreground = '#000000'
    powerline_symbol = ''
    background = '#8bc34a'
    type = 'git'
    style = 'powerline'
    background_templates = ['{{ if or (.Working.Changed) (.Staging.Changed) }}#fdd835{{ end }}', '{{ if and (gt .Ahead 0) (gt .Behind 0) }}#f26d50{{ end }}', '{{ if gt .Ahead 0 }}#89d1dc{{ end }}', '{{ if gt .Behind 0 }}#4e9a06{{ end }}']

    [blocks.segments.options]
      branch_icon = ' '
      fetch_status = true

[[blocks]]
  type = 'prompt'
  alignment = 'right'

  [[blocks.segments]]
    template = ' :{{ .Major }}'
    foreground = '#8bc34a'
    type = 'node'

    [blocks.segments.options]
      fetch_version = true

  [[blocks.segments]]
    template = ' :{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    foreground = '#26c6da'
    type = 'go'

    [blocks.segments.options]
      fetch_version = true

  [[blocks.segments]]
    template = ' :{{ if .Error }}{{ .Error }}{{ else }}{{ .Full }}{{ end }}'
    foreground = '#c62828'
    type = 'rust'

    [blocks.segments.options]
      fetch_version = true

  [[blocks.segments]]
    template = ' :{{ if .Error }}{{ .Error }}{{ else }}{{ if .Venv }}{{ .Venv }} {{ end }}{{ .Full }}{{ end }}'
    foreground = '#ffe873'
    type = 'python'

    [blocks.segments.options]
      display_mode = 'files'
      fetch_virtual_env = true

  [[blocks.segments]]
    template = ' (nix-{{ .Type }})'
    foreground = 'blue'
    type = 'nix-shell'

  [[blocks.segments]]
    template = ' :{{ .Context }}'
    foreground = '#5b86e8'
    type = 'docker'

  [[blocks.segments]]
    template = ' :{{.Context}}::{{if .Namespace}}{{.Namespace}}{{else}}default{{end}}'
    foreground = '#eeeeee'
    type = 'kubectl'

  [[blocks.segments]]
    template = ' :{{ .WorkspaceName }}{{ if .Version }} {{ .Version }}{{ end }}'
    type = 'terraform'
    foreground = '#ebcc34'

    [blocks.segments.options]
      command = 'tofu'

  [[blocks.segments]]
    template = ' :{{ .Profile }}'
    foreground = '#ff5722'
    background_templates = ['{{if contains "default" .Profile}}#ffa400{{end}}', '{{if contains "ydl" .Profile}}#f1184c{{end}}']
    type = 'aws'

    [blocks.segments.options]
      display_default = false

  [[blocks.segments]]
    template = ' {{ .FormattedMs }} '
    foreground = '#fdd835'
    type = 'executiontime'

    [blocks.segments.options]
      style = 'round'
      threshold = 5000

  [[blocks.segments]]
    template = ' {{ if gt .Code 0 }}✘{{ else }}✔{{ end }} '
    foreground = '#7cb342'
    foreground_templates = ['{{ if gt .Code 0 }}#f44336{{ end }}']
    type = 'status'

    [blocks.segments.options]
      always_enabled = true

[[blocks]]
  type = 'prompt'
  alignment = 'left'

  [[blocks.segments]]
    template = '╰─ {{ if .Root }}#{{else}}${{end}}'
    foreground = '#d3d7cf'
    type = 'text'
    style = 'plain'

[transient_prompt]
  foreground_templates = [
    "{{if gt .Code 0}}red{{end}}",
    "{{if eq .Code 0}}green{{end}}",
  ]
  background = 'transparent'
  template = '❯ '

[maps]
[maps.host_name]
  Yovkos-MacBook-Air = "air"
  "eos.yovko.net" = "eos"
[maps.user_name]
  root = "🚀"

[upgrade]
  source = 'cdn'
  interval = '168h'
  auto = false
  notice = false
